<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Indicadores - SICGM</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/gestao.css">
    <link rel="stylesheet" href="../css/chamados.css">
    <link rel="stylesheet" href="../css/power-bi.css">
</head>
<body>
    <div class="bi-container">
        <!-- ============================================ -->
        <!-- HEADER                                       -->
        <!-- ============================================ -->
        <div class="bi-header">
            <h1>📊 Indicadores — Power BI</h1>
            <div class="bi-header-actions">
                <button class="bi-btn bi-btn-atualizar" onclick="recarregarBI()" title="Recarregar o BI">
                    🔄 <span>Atualizar</span>
                </button>
                <button class="bi-btn bi-btn-tela-cheia" onclick="abrirFullscreen()" title="Tela cheia">
                    ⛶ <span>Tela Cheia</span>
                </button>
                <button class="bi-btn bi-btn-voltar" onclick="redirecionarParaHome()" title="Voltar para a Home">
                    ⬅ <span>Voltar</span>
                </button>
            </div>
        </div>

        <!-- ============================================ -->
        <!-- ABAS DE BI                                   -->
        <!-- ============================================ -->
        <div class="bi-tabs-bar" id="biTabsBar">
            <button class="bi-tab-btn active" data-bi="pendencia-requisicao" onclick="selecionarBI('pendencia-requisicao')">
                📋 Pendência de Requisição
                <span class="badge badge-ativo">Ativo</span>
            </button>
            <button class="bi-tab-btn desativado" data-bi="aditivos" onclick="selecionarBI('aditivos')">
                📝 Aditivos
                <span class="badge badge-em-breve">Em breve</span>
            </button>
            <button class="bi-tab-btn desativado" data-bi="devolucao" onclick="selecionarBI('devolucao')">
                📦 Devolução Física
                <span class="badge badge-em-breve">Em breve</span>
            </button>
            <button class="bi-tab-btn desativado" data-bi="farol" onclick="selecionarBI('farol')">
                🚦 Farol de Obras
                <span class="badge badge-em-breve">Em breve</span>
            </button>
        </div>

        <!-- ============================================ -->
        <!-- CONTEÚDO (IFRAME / EMPTY)                    -->
        <!-- ============================================ -->
        <div class="bi-content">
            <div class="bi-iframe-wrapper" id="biIframeWrapper">
                <div class="bi-loading-overlay" id="biLoading">
                    <div class="spinner"></div>
                    <p>⏳ Carregando o BI...</p>
                </div>
                <iframe 
                    id="biFrame"
                    title="PENDENCIAS DE REQUISIÇÃO" 
                    src="https://app.powerbi.com/view?r=eyJrIjoiMzQyNTFkMjctN2U0My00Njk5LWEwMWItNDMwNGI3NmIyNjljIiwidCI6ImUyNjkyZjMyLTAwNzItNDY5Ni04Yjg0LWEzZjdkOGUxNWUxYSJ9" 
                    frameborder="0" 
                    allowFullScreen="true"
                    onload="onFrameLoad()">
                </iframe>
            </div>
        </div>

        <!-- ============================================ -->
        <!-- STATUS BAR                                   -->
        <!-- ============================================ -->
        <div class="bi-status-bar">
            <span class="bi-status-indicator">
                <span class="bi-status-dot online" id="biStatusDot"></span>
                <span id="biStatusText">Conectado</span>
            </span>
            <span id="biStatusTime"></span>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- FIREBASE SDK                                 -->
    <!-- ============================================ -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <!-- ============================================ -->
    <!-- CONFIGURAÇÕES DO SISTEMA (ORDEM IMPORTA!)    -->
    <!-- ============================================ -->
    <script src="../js/firebase-config.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth-service.js"></script>
    <script src="../js/auth-helper.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/auth-global.js"></script>
    <script src="../js/chamados.js" defer></script>

    <!-- ============================================ -->
    <!-- SCRIPT DA PÁGINA                             -->
    <!-- ============================================ -->
    <script src="../js/power-bi.js"></script>
</body>
</html>
