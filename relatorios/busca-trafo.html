<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SICGM - Busca Trafo</title>
    
    <!-- Ordem de importação: base → design-system → página específica -->
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/busca-trafo.css">
    <link rel="stylesheet" href="../css/chamados.css">
</head>
<body>

    <button id="btnTopo" class="btn-navegacao btn-topo" onclick="irParaTopo()" title="Ir para o topo">
        <span class="btn-navegacao-icone">⬆</span>
        <span class="btn-navegacao-texto">Topo</span>
    </button>

    <button id="btnFim" class="btn-navegacao btn-fim" onclick="irParaFim()" title="Ir para o fim da página">
        <span class="btn-navegacao-icone">⬇</span>
        <span class="btn-navegacao-texto">Fim</span>
    </button>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">Validando acesso...</div>
    </div>

    <div class="container" id="mainContent" style="display: none;">

        <div class="filtros-container">
            <div class="filtro-row">
                <div class="filtro-item">
                    <label for="filtroCodMat">Cód. Mat</label>
                    <input type="text" id="filtroCodMat" placeholder="Ex: 90063">
                </div>
                <div class="filtro-item">
                    <label for="filtroDescricao">Descrição</label>
                    <input type="text" id="filtroDescricao" placeholder="Ex: 75KVA">
                </div>
                <div class="filtro-item">
                    <label for="filtroFabricante">Fabricante</label>
                    <input type="text" id="filtroFabricante" placeholder="Ex: ITAIPU">
                </div>
                <div class="filtro-item">
                    <label for="filtroSerie">Nº de Série</label>
                    <input type="text" id="filtroSerie" placeholder="Ex: 232691">
                </div>
                <div class="filtro-item">
                    <label for="filtroTombamento">Tombamento</label>
                    <input type="text" id="filtroTombamento" placeholder="Ex: 58158">
                </div>
                <div class="filtro-item">
                    <label for="filtroStatus">Status</label>
                    <select id="filtroStatus">
                        <option value="">Todos</option>
                        <option value="Estoque">Estoque</option>
                        <option value="Obra">Obra</option>
                        <option value="Transferido">Transferido</option>
                        <option value="Falta">Falta</option>
                    </select>
                </div>
            </div>

            <div class="filtro-row">
                <div class="filtro-item data-item">
                    <label for="filtroDataInicio">Dt. Rec. Energisa (Início)</label>
                    <input type="date" id="filtroDataInicio">
                </div>
                <div class="filtro-item data-item">
                    <label for="filtroDataFim">Dt. Rec. Energisa (Fim)</label>
                    <input type="date" id="filtroDataFim">
                </div>
                <div class="filtro-item">
                    <label for="filtroOrdenacao">Ordenar por</label>
                    <select id="filtroOrdenacao">
                        <option value="codigo">Código (A-Z)</option>
                        <option value="codigo-desc">Código (Z-A)</option>
                        <option value="descricao">Descrição (A-Z)</option>
                        <option value="descricao-desc">Descrição (Z-A)</option>
                        <option value="data">Data Rec. (Mais recente)</option>
                        <option value="data-desc">Data Rec. (Mais antiga)</option>
                        <option value="status">Status (A-Z)</option>
                        <option value="status-desc">Status (Z-A)</option>
                    </select>
                </div>
                <div class="filtro-acoes">
                    <button class="btn-filtrar" id="btnBuscar">🔍 Buscar</button>
                    <button class="btn-limpar-filtros" id="btnLimparFiltros">✕ Limpar</button>
                </div>
            </div>
        </div>

        <div class="stats" id="stats">
            <div class="stats-info">
                <span>📊 <span class="destaque" id="totalRegistros">0</span> registros</span>
                <span>📌 <span class="destaque" id="statusEstoque">0</span> estoque</span>
                <span>🔧 <span class="destaque" id="statusObra">0</span> obra</span>
                <span>🔄 <span class="destaque" id="statusTransferido">0</span> transferidos</span>
                <span>❌ <span class="destaque" id="statusFalta">0</span> falta</span>
            </div>
        </div>

        <div class="tabela-wrapper">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th class="sortable" data-sort="codigo" onclick="ordenarPor('codigo')">
                                <span class="th-content">Cód. Mat <span class="th-icon">▼</span></span>
                            </th>
                            <th class="sortable" data-sort="descricao" onclick="ordenarPor('descricao')">
                                <span class="th-content">Descrição <span class="th-icon">▼</span></span>
                            </th>
                            <th class="sortable" data-sort="fabricante" onclick="ordenarPor('fabricante')">
                                <span class="th-content">Fabricante <span class="th-icon">▼</span></span>
                            </th>
                            <th class="sortable" data-sort="serie" onclick="ordenarPor('serie')">
                                <span class="th-content">Nº Série <span class="th-icon">▼</span></span>
                            </th>
                            <th class="sortable" data-sort="tombamento" onclick="ordenarPor('tombamento')">
                                <span class="th-content">Tombamento <span class="th-icon">▼</span></span>
                            </th>
                            <th class="sortable" data-sort="status" onclick="ordenarPor('status')">
                                <span class="th-content">Status <span class="th-icon">▼</span></span>
                            </th>
                            <th class="sortable" data-sort="data" onclick="ordenarPor('data')">
                                <span class="th-content">Dt. Rec. Energisa <span class="th-icon">▼</span></span>
                            </th>
                            <th>Dt. Saída</th>
                            <th>Histórico</th>
                            <th>Obra/SS</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaCorpo">
                        <tr>
                            <td colspan="10" class="text-center" style="padding: 40px;">Carregando dados...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth-service.js"></script>
    <script src="../js/auth-helper.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/auth-global.js"></script>
    <script src="../js/busca-trafo.js"></script>
    <script src="../js/chamados.js" defer></script>
    <script src="../js/iframe-nav.js"></script>

    <script>
        function redirecionarParaHome() {
            window.location.href = '../home-unificada.html';
        }

        function irParaTopo() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function irParaFim() {
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function controlarBotoesNavegacao() {
            const btnTopo = document.getElementById('btnTopo');
            const btnFim = document.getElementById('btnFim');
            const scrollY = window.scrollY;
            const alturaTotal = document.body.scrollHeight - window.innerHeight;

            if (scrollY > 200) btnTopo.classList.add('visivel');
            else btnTopo.classList.remove('visivel');

            if (scrollY < alturaTotal - 100) btnFim.classList.add('visivel');
            else btnFim.classList.remove('visivel');
        }

        document.addEventListener('DOMContentLoaded', function() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            const mainContent = document.getElementById('mainContent');
            
            if (loadingOverlay) loadingOverlay.classList.add('active');

            let usuario = null;
            if (typeof authService !== 'undefined' && authService && authService.isLoggedIn()) {
                usuario = authService.getUserData();
            }
            
            if (!usuario) {
                window.location.href = '../login.html';
                return;
            }

            try {
                document.getElementById('nomeUsuario').textContent = usuario.nome || 'Usuário';
                document.getElementById('matriculaUsuario').textContent = `Matrícula: ${usuario.matricula || '---'}`;
                document.getElementById('perfilUsuario').textContent = usuario.perfil || 'GESTÃO';
            } catch (e) {
                console.error('Erro ao carregar dados do usuário:', e);
            }

            window.addEventListener('scroll', controlarBotoesNavegacao);
            window.addEventListener('resize', controlarBotoesNavegacao);
            setTimeout(controlarBotoesNavegacao, 100);

            setTimeout(() => {
                if (loadingOverlay) loadingOverlay.classList.remove('active');
                if (mainContent) mainContent.style.display = 'block';
            }, 500);
        });
    </script>
</body>
</html>
