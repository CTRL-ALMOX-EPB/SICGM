<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SICGM</title>
    
    <!-- CSS Base - Usa CONFIG se disponível -->
    <link rel="stylesheet" href="css/base.css">
    
    <!-- CSS Login -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo-container">
                <img src="assets/img/logo-control.png" alt="Logo da Empresa" class="logo" 
                     onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22%234299E1%22/%3E%3Ctext x=%2250%22 y=%2255%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2220%22 font-family=%22Arial%22%3ESICGM%3C/text%3E%3C/svg%3E'">
            </div>
            <h2>SICGM - Sistema de Gestão</h2>
            
            <!-- Informação do ambiente (apenas em desenvolvimento) -->
            <div id="envInfo" style="font-size: 11px; color: #718096; margin-bottom: 15px; text-align: center;"></div>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="matricula">Matrícula:</label>
                    <input type="text" id="matricula" placeholder="Digite sua matrícula" required autofocus>
                </div>
                <div class="input-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" placeholder="Digite os 4 primeiros dígitos do CPF" required>
                </div>
                <div id="mensagemErro" class="mensagem-erro"></div>
                <button type="submit" class="btn-login">Login</button>
            </form>
            
            <!-- Informações de teste (apenas em desenvolvimento) -->
            <div id="testUsers" style="margin-top: 15px; padding: 10px; background: #f7fafc; border-radius: 8px; font-size: 12px; display: none;">
                <p style="margin: 0 0 5px 0; font-weight: 600; color: #4a5568;">🔑 Usuários de teste:</p>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 11px; color: #718096;">
                    <div><strong>Gestão:</strong> 999999 | Senha: 1234</div>
                    <div><strong>Operacional:</strong> 000172 | Senha: 5319</div>
                    <div><strong>Visualização:</strong> 888888 | Senha: 9876</div>
                </div>
            </div>
            
            <div class="login-footer">
                <span>Sistema interno - Acesso restrito</span>
            </div>
        </div>
    </div>
    
    <!-- Scripts - Ordem correta -->
    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
    <script src="js/login.js"></script>
    
    <script>
        // Mostra informações do ambiente
        document.addEventListener('DOMContentLoaded', function() {
            const envInfo = document.getElementById('envInfo');
            const testUsers = document.getElementById('testUsers');
            
            if (typeof CONFIG !== 'undefined' && CONFIG) {
                if (CONFIG.isDevelopment) {
                    envInfo.innerHTML = '🛠️ <strong>Ambiente de Desenvolvimento</strong> - Dados locais';
                    envInfo.style.color = '#48BB78';
                    testUsers.style.display = 'block';
                    console.log('🛠️ Modo desenvolvimento ativado - Usuários de teste disponíveis');
                } else {
                    envInfo.innerHTML = '🚀 <strong>Ambiente de Produção</strong>';
                    envInfo.style.color = '#4299E1';
                }
            } else {
                envInfo.innerHTML = '⚠️ Configuração não encontrada - Usando fallback';
                envInfo.style.color = '#ED8936';
            }
        });
    </script>
</body>
</html>
