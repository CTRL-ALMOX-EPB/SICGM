<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SICGM - S.A. Emergencial</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚨</text></svg>">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/sa-emergencial.css">
    
    <style>
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 6px 0;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 14px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-left .title {
            font-size: 1.3rem;
            color: #2d3748;
            margin: 0;
            font-weight: 700;
        }
        .header-timer {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .session-timer-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #718096;
            background: rgba(66, 153, 225, 0.06);
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid rgba(66, 153, 225, 0.12);
            white-space: nowrap;
            height: 26px;
        }
        .session-timer-wrapper .timer-icon { font-size: 12px; }
        .session-timer-wrapper .timer-label { color: #A0AEC0; font-size: 10px; font-weight: 500; }
        .session-timer-wrapper .timer-status { font-size: 9px; color: #A0AEC0; font-weight: 400; }
        #sessionTimer { font-weight: 600; min-width: 35px; font-family: 'Courier New', monospace; font-size: 12px; color: #48BB78; }
        #sessionTimer.normal { color: #48BB78; }
        #sessionTimer.warning { color: #ECC94B; }
        #sessionTimer.danger { color: #E53E3E; font-weight: 800; animation: timerBlink 1s ease-in-out infinite; }
        @keyframes timerBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <!-- Botões de navegação -->
    <button id="btnTopo" class="btn-navegacao btn-topo" onclick="irParaTopo()" title="Ir para o topo">
        <span class="btn-navegacao-icone">⬆</span>
        <span class="btn-navegacao-texto">Topo</span>
    </button>
    <button id="btnFim" class="btn-navegacao btn-fim" onclick="irParaFim()" title="Ir para o fim da página">
        <span class="btn-navegacao-icone">⬇</span>
        <span class="btn-navegacao-texto">Fim</span>
    </button>

    <div class="container">
        <div class="form-card">
            <!-- Logo e Título com Timer -->
            <div class="header-container">
                <div class="header-left">
                    <img src="../assets/img/logo-control.png" alt="Logo SITA" class="logo-empresa">
                    <h1 class="title">🚨 S.A. Emergencial</h1>
                </div>
                <div class="header-timer">
                    <div class="session-timer-wrapper">
                        <span class="timer-icon">⏱️</span>
                        <span class="timer-label">Sessão:</span>
                        <span id="sessionTimer">30:00</span>
                        <span class="timer-status">(ativa)</span>
                    </div>
                </div>
            </div>
            
            <!-- Botão Voltar -->
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center; flex-wrap: wrap; gap: 10px;">
                <button onclick="redirecionarParaHome()" class="btn-voltar-home">🏠 Voltar ao Início</button>
                <button onclick="exportarSAPainel()" class="btn-exportar-pdf" id="btnExportarPDFPainel" style="display: none;">
                    📄 Exportar PDF Selecionado
                </button>
            </div>

            <!-- Header do Usuário -->
            <div class="user-header" id="userHeader">
                <div class="user-info">
                    <div class="avatar" id="userAvatar">U</div>
                    <div class="user-details">
                        <h3 id="userName">Carregando...</h3>
                        <p id="userRole">Carregando...</p>
                        <p id="userMatricula">Matrícula: ---</p>
                    </div>
                </div>
                <div class="user-actions">
                    <button class="btn-primary" id="btnNovaSA">➕ Nova S.A.</button>
                </div>
            </div>

            <!-- Lista de SA com Filtros -->
            <div class="sa-list-container">
                <div id="saList">
                    <div class="sa-list-loading">
                        <div class="spinner"></div>
                        <p>⏳ Carregando S.A. Emergenciais...</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Rodapé -->
        <div style="text-align: center; margin-top: 1rem;">
            <button onclick="redirecionarParaHome()" style="background: transparent; color: #4299E1; border: none; cursor: pointer; font-weight: 500; font-size: 14px; text-decoration: underline;">
                ← Voltar para Home
            </button>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- 🔥 FIREBASE SDK                              -->
    <!-- ============================================ -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <!-- ============================================ -->
    <!-- 🔥 CONFIGURAÇÕES DO SISTEMA (ORDEM IMPORTA!) -->
    <!-- ============================================ -->
    <script src="../js/firebase-config.js"></script>   
    <script src="../js/config.js"></script>  
    <script src="../js/auth-service.js"></script>      
    <script src="../js/auth-helper.js"></script>  
    <script src="../js/timer.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/auth-global.js"></script>  
    <Script src="../js/login.js"></script>      
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <script src="../js/sa-emergencial.js"></script>
</body>
</html>
