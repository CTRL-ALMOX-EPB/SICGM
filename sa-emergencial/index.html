<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SICGM - S.A. Emergencial</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚨</text></svg>">

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/sa-emergencial.css">
    <link rel="stylesheet" href="../css/chamados.css">
</head>
<body>
    <button id="btnTopo" class="btn-navegacao btn-topo" onclick="irParaTopo()" title="Ir para o topo">
        <span class="btn-navegacao-icone">⬆</span>
        <span class="btn-navegacao-texto">Topo</span>
    </button>
    <button id="btnFim" class="btn-navegacao btn-fim" onclick="irParaFim()" title="Ir para o fim da página">
        <span class="btn-navegacao-icone">⬇</span>
        <span class="btn-navegacao-texto">Fim</span>
    </button>

    <div class="container">
        <div class="sa-list-container">
            <div id="saList">
                <div class="sa-list-loading">
                    <div class="spinner"></div>
                    <p>⏳ Carregando S.A. Emergenciais...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <script src="../js/firebase-config.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth-service.js"></script>
    <script src="../js/auth-helper.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/auth-global.js"></script>
    <script src="../js/login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <script src="../js/sa-emergencial.js"></script>
    <script src="../js/chamados.js" defer></script>
    <script src="../js/iframe-nav.js"></script>
</body>
</html>
