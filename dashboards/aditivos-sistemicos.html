<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Aditivos Sistêmicos</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/dashboards-common.css">
    <link rel="stylesheet" href="../css/dashboards-aditivos-sistemicos.css">
    <link rel="stylesheet" href="../css/chamados.css">
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">Carregando dashboard...</div>
    </div>

    <!-- 🔥 IDs ocultos que o JS pode precisar (mantidos por compatibilidade) -->
    <div style="display:none;">
        <span id="userName">Carregando...</span>
        <span id="userMatricula">Matrícula: ---</span>
        <span id="userPerfil">GESTÃO</span>
    </div>

    <div class="dashboard-container" id="dashboardContent" style="display: none;">

        <!-- BARRA DE FILTROS + BOTÕES -->
        <div class="filters-bar">
            <div class="filter-group">
                <label>📅 Período:</label>
                <input type="date" id="filterDataInicio">
                <span>até</span>
                <input type="date" id="filterDataFim">
            </div>
            <div class="filter-group">
                <label>📊 Status:</label>
                <select id="filterStatus">
                    <option value="todos">Todos</option>
                    <option value="ANALISE">📊 Análise</option>
                    <option value="APROVADO">✅ Aprovado</option>
                    <option value="REPROVADO">❌ Reprovado</option>
                    <option value="S/ SOLICITAÇÃO">📋 Sem Solicitação</option>
                </select>
            </div>
            <div class="filter-group">
                <label>🔍 Buscar:</label>
                <input type="text" id="filterBusca" placeholder="Código ou descrição..." style="width: 180px;">
            </div>
            <div class="filter-group">
                <label>🏗️ Obra:</label>
                <input type="text" id="filterObra" placeholder="Número da obra..." style="width: 140px;">
            </div>

            <div class="filter-actions-group">
                <button class="btn-filter primary" onclick="aplicarFiltros()">🔍 Filtrar</button>
                <button class="btn-filter secondary" onclick="limparFiltros()">🧹 Limpar</button>
                <button class="btn-filter home" onclick="redirecionarParaHome()">🏠 Início</button>
                <span class="total-registros" id="totalRegistros">0 aditivos</span>
            </div>
        </div>

        <!-- Meses -->
        <div class="meses-container" id="mesesContainer">
            <span style="font-size: 12px; color: #6b7a8f; margin-right: 8px; font-weight: 600;">📅 FILTRAR POR MÊS:</span>
        </div>

        <!-- KPIs -->
        <div class="kpi-grid" id="kpiGrid">
            <div class="loading-dashboard" style="min-height: 60px; grid-column: 1 / -1;">
                <div class="spinner"></div>
            </div>
        </div>

        <!-- Conteúdo Principal -->
        <div class="dashboard-main">
            <div class="dashboard-card">
                <h3 id="listTitle">📦 Itens Aditivados</h3>
                <div id="itemList" class="item-group-list">
                    <div class="loading-dashboard">
                        <div class="spinner"></div>
                        <p>Carregando itens...</p>
                    </div>
                </div>
            </div>

            <div class="dashboard-card">
                <h3>📋 Detalhes</h3>
                <div id="itemDetails" class="item-details-panel">
                    <div class="empty-state-dashboard">
                        <div class="icon">👆</div>
                        <p>Selecione um item ou obra para ver os detalhes</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="dashboard-charts">
            <div class="dashboard-card">
                <h3>📊 Ocorrências por Status</h3>
                <div id="statusChart" class="chart-container">
                    <div class="loading-dashboard" style="min-height: 100px;">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>

            <div class="dashboard-card">
                <h3>💰 Valores por Status</h3>
                <div id="valorChart" class="chart-container">
                    <div class="loading-dashboard" style="min-height: 100px;">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <script src="../js/firebase-config.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth-service.js"></script>
    <script src="../js/auth-helper.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/auth-global.js"></script>
    <script src="../js/login.js"></script>
    <script src="../js/dashboards-common.js"></script>
    <script src="../js/dashboards-cache.js"></script>

    <!-- 🔥 DIAGNÓSTICO: captura erros do dashboards-aditivos-sistemicos.js -->
    <script>
        window.addEventListener('error', function(e) {
            if (e.filename && e.filename.includes('dashboards-aditivos-sistemicos')) {
                console.error('❌ ERRO EM dashboards-aditivos-sistemicos.js:');
                console.error('  Mensagem:', e.message);
                console.error('  Linha:', e.lineno, 'Coluna:', e.colno);
                console.error('  Arquivo:', e.filename);

                // Mostra um alerta visível
                const overlay = document.getElementById('loadingOverlay');
                if (overlay) {
                    overlay.innerHTML = `
                        <div style="text-align:center; padding:30px; max-width:500px;">
                            <div style="font-size:48px; margin-bottom:10px;">❌</div>
                            <h3 style="color:#c53030; margin-bottom:10px;">Erro ao carregar dashboard</h3>
                            <p style="color:#4a5568; font-size:14px; margin-bottom:10px;">
                                <strong>${e.message}</strong>
                            </p>
                            <p style="color:#718096; font-size:12px; margin-bottom:15px;">
                                Linha ${e.lineno} · ${e.filename.split('/').pop()}
                            </p>
                            <p style="color:#718096; font-size:12px;">
                                Abra o console (F12) para mais detalhes
                            </p>
                            <button onclick="window.location.reload()" style="margin-top:15px; padding:10px 20px; background:#3d8bfd; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:600;">
                                🔄 Recarregar
                            </button>
                        </div>
                    `;
                    overlay.style.display = 'flex';
                }
            }
        });
    </script>

    <script src="../js/dashboards-aditivos-sistemicos.js"></script>
    <script src="../js/chamados.js" defer></script>
    <script src="../js/iframe-nav.js"></script>

    <script>
        function redirecionarParaHome() {
            window.location.href = '../home-unificada.html';
        }
    </script>
</body>
</html>
