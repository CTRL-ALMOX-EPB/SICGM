<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Pendência de Devolução</title>
    
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/dashboards-common.css">
    <link rel="stylesheet" href="../css/dashboards-pendencia-devolucao.css">
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">Carregando dashboard...</div>
    </div>

    <div class="dashboard-container" id="dashboardContent" style="display: none;">
        <!-- Header -->
        <div class="dashboard-header">
            <div>
                <h1>📦 Pendências de Devolução</h1>
                <p style="font-size: 14px; opacity: 0.8; margin: 4px 0 0 0;">Acompanhamento de pendências de devolução por obra e encarregado</p>
            </div>
            <div class="user-info">
                <div>
                    <div class="user-name" id="userName">Carregando...</div>
                    <div class="user-matricula" id="userMatricula">Matrícula: ---</div>
                </div>
                <span class="user-perfil" id="userPerfil">GESTÃO</span>
                <button class="btn-sair" onclick="redirecionarParaHome()">🏠 Home</button>
            </div>
        </div>

        <!-- KPIs -->
        <div class="kpi-grid" id="kpiGrid">
            <div class="loading-dashboard" style="min-height: 60px;">
                <div class="spinner"></div>
            </div>
        </div>

        <!-- Conteúdo Principal -->
        <div class="dashboard-main">
            <div class="dashboard-left">
                <div class="dashboard-card">
                    <h3>👤 Encarregados com Pendências</h3>
                    <div id="encarregadoFilterList" class="encarregado-filter-list">
                        <div class="loading-dashboard" style="min-height: 100px;">
                            <div class="spinner"></div>
                            <p style="margin-top: 10px;">Carregando encarregados...</p>
                        </div>
                    </div>
                    <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #e2e8f0; text-align: center;">
                        <button class="btn-filter secondary" onclick="limparFiltroEncarregado()" style="width: 100%;">
                            🧹 Mostrar Todos
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="dashboard-right">
                <div class="dashboard-card">
                    <h3>📋 Lista de Obras Pendentes <span id="pendenciaCount" style="font-size: 14px; color: #718096; font-weight: normal;"></span></h3>
                    <div id="pendenciaList" class="pendencia-list">
                        <div class="loading-dashboard" style="min-height: 200px;">
                            <div class="spinner"></div>
                            <p style="margin-top: 10px;">Carregando pendências...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/script.js"></script>
    <script src="../js/dashboards-common.js"></script>
    <script src="../js/dashboards-cache.js"></script>
    <script src="../js/dashboards-pendencia-devolucao.js"></script>
</body>
</html>
