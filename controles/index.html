<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SICGM - Controles DCMD</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/controles-dcmd.css">
    <link rel="stylesheet" href="../css/chamados.css">
</head>
<body>
    <button id="btnTopo" class="btn-navegacao btn-topo" onclick="irParaTopo()" title="Ir para o topo">
        <span class="btn-navegacao-icone">⬆</span>
        <span class="btn-navegacao-texto">Topo</span>
    </button>
    <button id="btnFim" class="btn-navegacao btn-fim" onclick="irParaFim()" title="Ir para o fim da página">
        <span class="btn-navegacao-icone">⬇</span>
        <span class="btn-navegacao-texto">Fim</span>
    </button>

    <div class="container">

        <!-- SELETOR DE TIPO -->
        <div class="tipo-selector">
            <button class="tipo-btn active" data-tipo="aditivo" onclick="selecionarTipo('aditivo')">
                📝 Aditivo Sistêmico
            </button>
            <button class="tipo-btn" data-tipo="aditivo-fisico" onclick="selecionarTipo('aditivo-fisico')">
                🔧 Aditivo Físico
            </button>
            <button class="tipo-btn" data-tipo="farol" onclick="selecionarTipo('farol')">
                🚦 Farol de Obras
            </button>
            <button class="tipo-btn" data-tipo="devolucao" onclick="selecionarTipo('devolucao')">
                📦 Pendências de Devolução
            </button>
            <button class="tipo-btn" data-tipo="movimento" onclick="selecionarTipo('movimento')">
                📄 Controle de Movimentações
            </button>
            <button class="tipo-btn" data-tipo="mgm" onclick="selecionarTipo('mgm')">
                📋 MGM Online
            </button>
        </div>

        <!-- BARRA DE FILTROS + BOTÕES -->
        <div class="filtros-container" id="filtrosContainer">
            <div class="filtro-item">
                <label>🔢 Nº</label>
                <input type="text" id="filtro-numero" placeholder="Ex: 1234" oninput="aplicarFiltros()">
            </div>
            <div class="filtro-item">
                <label>🏗️ Obra</label>
                <input type="text" id="filtro-obra" placeholder="Digite a obra..." oninput="aplicarFiltros()">
            </div>
            <div class="filtro-item">
                <label>📅 Data</label>
                <input type="text"
                       id="filtro-data"
                       placeholder="DD/MM/AAAA"
                       maxlength="10"
                       inputmode="numeric"
                       autocomplete="off"
                       title="Digite no formato DD/MM/AAAA"
                       oninput="mascararData(this)"
                       onchange="agendarFiltroData()">
            </div>
            <div class="filtro-item">
                <label>📌 Status</label>
                <select id="filtro-status" onchange="aplicarFiltros()">
                    <option value="">Todos</option>
                    <option value="PENDENTE">Pendente</option>
                    <option value="FINALIZADO">Finalizado</option>
                </select>
            </div>
            <div class="filtro-item">
                <label>📊 Ordenar</label>
                <select id="filtro-ordenacao" onchange="aplicarOrdenacao()">
                    <option value="data_desc">📅 Mais Recente</option>
                    <option value="data_asc">📅 Mais Antiga</option>
                    <option value="obra_asc">🏗️ Obra (A-Z)</option>
                    <option value="obra_desc">🏗️ Obra (Z-A)</option>
                    <option value="numero_asc">🔢 Nº Crescente</option>
                    <option value="numero_desc">🔢 Nº Decrescente</option>
                </select>
            </div>

            <!-- BOTÕES (dentro da barra de filtros) -->
            <div class="filtro-acoes">
                <button class="btn-limpar-filtros" onclick="limparFiltros()">✕ Limpar</button>
                <button class="btn-primary" id="btnNovoControle">➕ Novo Controle</button>
            </div>

            <div class="filtro-contador">
                <span id="filtro-contador">Carregando...</span>
            </div>
        </div>

        <!-- LISTA -->
        <div class="controles-list-container">
            <div id="controlesList">
                <div class="controles-list-loading">
                    <div class="spinner"></div>
                    <p>⏳ Carregando controles...</p>
                </div>
            </div>
            <div class="paginacao-container" id="paginacao-container"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <script src="../js/firebase-config.js"></script>
    <script src="../js/firebase-init.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth-service.js"></script>
    <script src="../js/auth-helper.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/auth-global.js"></script>

    <script src="../js/iframe-nav.js"></script>

    <script src="../js/controles-dcmd.js"></script>
    <script src="../js/chamados.js" defer></script>

    <script>
        function redirecionarParaHome() {
            window.location.href = '../home-unificada.html';
        }
        function irParaTopo() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
        function irParaFim() { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }
        function controlarBotoesNavegacao() {
            const btnTopo = document.getElementById('btnTopo');
            const btnFim = document.getElementById('btnFim');
            const scrollY = window.scrollY;
            const alturaTotal = document.body.scrollHeight - window.innerHeight;
            if (scrollY > 200) btnTopo.classList.add('visivel'); else btnTopo.classList.remove('visivel');
            if (scrollY < alturaTotal - 100) btnFim.classList.add('visivel'); else btnFim.classList.remove('visivel');
        }
        document.addEventListener('DOMContentLoaded', function() {
            window.addEventListener('scroll', controlarBotoesNavegacao);
            window.addEventListener('resize', controlarBotoesNavegacao);
            setTimeout(controlarBotoesNavegacao, 100);
        });
    </script>
</body>
</html>
