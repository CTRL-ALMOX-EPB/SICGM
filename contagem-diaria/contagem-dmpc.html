<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SICGM - Contagem DMPC</title>
    
    <!-- CSS Base -->
    <link rel="stylesheet" href="../css/base.css">
    
    <!-- CSS Contagem DMPC -->
    <link rel="stylesheet" href="../css/contagem-semanal-dmpc.css">
</head>
<body>
    <!-- ============================================ -->
    <!-- BOTÃO IR PARA O TOPO (FIXO NO CANTO)        -->
    <!-- ============================================ -->
    <button id="btnTopo" class="btn-navegacao btn-topo" onclick="irParaTopo()" title="Ir para o topo">
        <span class="btn-navegacao-icone">⬆</span>
        <span class="btn-navegacao-texto">Topo</span>
    </button>

    <!-- ============================================ -->
    <!-- BOTÃO IR PARA O FIM (FIXO NO CANTO)         -->
    <!-- ============================================ -->
    <button id="btnFim" class="btn-navegacao btn-fim" onclick="irParaFim()" title="Ir para o fim da página">
        <span class="btn-navegacao-icone">⬇</span>
        <span class="btn-navegacao-texto">Fim</span>
    </button>

    <!-- ============================================ -->
    <!-- CONTEÚDO PRINCIPAL                          -->
    <!-- ============================================ -->
    <div class="container">
        <div class="form-card">
            
            <!-- Logo e Título -->
            <div class="header-container">
                <img src="../assets/img/logo-control.png" alt="Logo SITA" class="logo-empresa">
                <h1 class="title">SICGM - Contagem DMPC</h1>
            </div>
            
            <!-- Botão Voltar ao Início -->
            <div style="display: flex; justify-content: flex-start; margin-bottom: 20px;">
                <button onclick="redirecionarParaHome()" class="btn-voltar-home">
                    🏠 Voltar ao Início
                </button>
            </div>
            
            <form id="contagemForm">
                
                <!-- Nome, Matrícula e Data lado a lado -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="nome">Nome *</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required readonly>
                    </div>

                    <div class="form-group">
                        <label for="matricula">Matrícula *</label>
                        <input type="text" id="matricula" name="matricula" placeholder="Digite sua matrícula" required readonly>
                    </div>

                    <div class="data-field">
                        <label for="data">Data</label>
                        <input type="date" id="data" name="data" readonly>
                    </div>
                </div>

                <!-- ============================================ -->
                <!-- FILTRO DE PESQUISA                          -->
                <!-- ============================================ -->
                <div class="filtro-container">
                    <div class="filtro-row">
                        <div class="filtro-input-group">
                            <label for="filtro-texto">🔍 Pesquisar</label>
                            <input type="text" id="filtro-texto" placeholder="Digite para pesquisar..." oninput="aplicarFiltro()">
                        </div>
                        <div class="filtro-select-group">
                            <label for="filtro-tipo">Filtrar por</label>
                            <select id="filtro-tipo" onchange="aplicarFiltro()">
                                <option value="codigo">Código</option>
                                <option value="descricao">Descrição</option>
                                <option value="todos" selected>Todos os campos</option>
                            </select>
                        </div>
                        <div class="filtro-clear-group">
                            <button type="button" class="btn-limpar-filtro" onclick="limparFiltro()">
                                ✕ Limpar
                            </button>
                        </div>
                    </div>
                    <div id="filtro-resultado" class="filtro-resultado">
                        <span id="filtro-contagem">Mostrando 0 itens</span>
                    </div>
                </div>

                <!-- ============================================ -->
                <!-- CONTAGEM DMPC - MATERIAIS PRÓPRIOS          -->
                <!-- ============================================ -->
                <div class="sub-titulo-secao">
                    <span class="sub-titulo-icone">📦</span>
                    <span>Materiais Próprios - Contagem Semanal</span>
                </div>

                <!-- Container dos materiais -->
                <div id="materiais-container">
                    <div id="loading-materiais" style="text-align: center; padding: 20px; color: #718096;">
                        ⏳ Carregando materiais...
                    </div>
                </div>
                
                <div id="mensagem" class="mensagem"></div>

                <button type="submit" class="submit-btn">📝 Registrar Contagem</button>
            </form>
            
        </div>
        
        <!-- Rodapé com link de voltar -->
        <div style="text-align: center; margin-top: 1rem;">
            <button onclick="redirecionarParaHome()" style="
                background: transparent;
                color: #4299E1;
                border: none;
                cursor: pointer;
                font-weight: 500;
                font-size: 14px;
                text-decoration: underline;
            ">
                ← Voltar para Home
            </button>
        </div>
    </div>

    <!-- Pop-up para descrição completa -->
    <div id="descricao-popup" class="descricao-popup"></div>
    <div id="popup-overlay" class="popup-overlay"></div>

    <!-- ============================================ -->
    <!-- 🔥 FIREBASE SDK                              -->
    <!-- ============================================ -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <!-- ============================================ -->
    <!-- 🔥 CONFIGURAÇÕES DO SISTEMA (ORDEM IMPORTA!) -->
    <!-- ============================================ -->
    <script src="../js/firebase-config.js"></script>   <!-- 1. Configura o Firebase -->
    <script src="../js/auth-service.js"></script>      <!-- 2. Cria o authService -->
    <script src="../js/auth-global.js"></script>       <!-- 3. Verifica sessão na página -->
    <script src="../js/auth-helper.js"></script>       <!-- 4. 🔥 FUNÇÕES AUXILIARES -->
    <script src="../js/script.js"></script>            <!-- 5. Funções globais -->
    <script src="../js/contagem-dmpc.js"></script>
    
    <!-- ============================================ -->
    <!-- REDIRECIONAMENTO LOCAL                      -->
    <!-- ============================================ -->
    <script>
        function redirecionarParaHome() {
            const sessao = verificarSessao();
            if (!sessao) {
                window.location.href = '../login.html';
                return;
            }

            const perfil = sessao.perfil || 'GESTAO';
            const homePages = {
                'GESTAO': '../home-gestao.html',
                'OPERACIONAL': '../home-operacional.html',
                'VISUALIZACAO': '../home-visualizacao.html'
            };

            window.location.href = homePages[perfil] || '../login.html';
        }

        function irParaTopo() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function irParaFim() {
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function controlarBotoesNavegacao() {
            const btnTopo = document.getElementById('btnTopo');
            const btnFim = document.getElementById('btnFim');
            const scrollY = window.scrollY;
            const alturaTotal = document.body.scrollHeight - window.innerHeight;

            if (scrollY > 200) {
                btnTopo.classList.add('visivel');
            } else {
                btnTopo.classList.remove('visivel');
            }

            if (scrollY < alturaTotal - 100) {
                btnFim.classList.add('visivel');
            } else {
                btnFim.classList.remove('visivel');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            window.addEventListener('scroll', controlarBotoesNavegacao);
            window.addEventListener('resize', controlarBotoesNavegacao);
            setTimeout(controlarBotoesNavegacao, 100);
        });
    </script>

</body>
</html>
