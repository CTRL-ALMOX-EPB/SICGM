<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processos - SICGM</title>
    
    <!-- CSS Base -->
    <link rel="stylesheet" href="../css/base.css">
    
    <!-- CSS Processos (passo a passo) -->
    <link rel="stylesheet" href="../css/processos.css">
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="spinner"></div>
        <div class="loading-text">Carregando processos...</div>
    </div>

    <div class="processos-container" id="processosContent" style="display: none;">
        <!-- Renderizado via JavaScript -->
    </div>
    
    <!-- ============================================ -->
    <!-- 🔥 FIREBASE SDK                              -->
    <!-- ============================================ -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <!-- ============================================ -->
    <!-- 🔥 CONFIGURAÇÕES DO SISTEMA (ORDEM IMPORTA!) -->
    <!-- ============================================ -->
    <script src="../js/firebase-config.js"></script>   <!-- 1. Configura o Firebase -->
    <script src="../js/auth-service.js"></script>      <!-- 2. Cria o authService -->
    <script src="../js/auth-global.js"></script>       <!-- 3. Verifica sessão na página -->
    <script src="../js/auth-helper.js"></script>       <!-- 4. 🔥 FUNÇÕES AUXILIARES -->
    <script src="../js/script.js"></script>            <!-- 5. Funções globais -->
    <script src="../js/processos.js"></script>
    <script src="../js/config.js"></script>
</body>
</html>
