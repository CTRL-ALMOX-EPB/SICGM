<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITA — Documento</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/sita.css">
</head>
<body data-page="documento">
<div class="sita-app">
    <div class="page-header">
        <div class="header-left">
            <img src="../assests/img/logo-control.png" alt="Control" class="logo-empresa" onerror="this.style.display='none'">
            <h1>📋 Documento <small id="docNumero">...</small></h1>
        </div>
    </div>

    <div id="docBannerArq" class="doc-banner-arq" style="display:none"></div>

    <div id="docHeader" class="doc-header"></div>
    <div id="docStepper" class="doc-stepper"></div>

    <div class="doc-tabs">
        <button class="tab-btn active" data-tab="etapa" onclick="SitaDocumento.mudarAba('etapa')">📋 Etapa Atual</button>
        <button class="tab-btn" data-tab="timeline" onclick="SitaDocumento.mudarAba('timeline')">🕓 Timeline</button>
    </div>
    <div id="tab-etapa" class="tab-panel active"></div>
    <div id="tab-timeline" class="tab-panel"></div>

    <!-- Modal de etapas concluídas -->
    <div id="modalEtapas" class="modal-overlay">
        <div class="modal-box" style="max-width:640px">
            <div class="modal-head">
                <h3>📋 Etapas concluídas</h3>
                <button class="btn-fechar" onclick="SitaDocumento.fecharModalEtapas()">✕</button>
            </div>
            <div class="modal-body" id="modalEtapasBody"></div>
            <div class="modal-foot">
                <button class="btn-filtrar" onclick="SitaDocumento.fecharModalEtapas()">Fechar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/firebase-init.js"></script>
<script src="../js/config.js"></script>
<script src="../js/auth-service.js"></script>
<script src="../js/sita.js"></script>
</body>
</html>
