<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITA — Programação</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/sita.css">
</head>
<body data-page="index">
<div class="sita-app">
    <div class="page-header">
        <div class="header-left">
            <img src="../assests/img/logo-control.png" alt="Control" class="logo-empresa" onerror="this.style.display='none'">
            <h1>SITA <small>Programação de Obras</small></h1>
        </div>
        <div class="header-right">
            <a href="#" onclick="abrirSubSita('esteira.html', 'SITA - Esteira'); return false;" class="btn-voltar-home">🚦 Esteira</a>
            <a href="#" onclick="abrirSubSita('despacho.html', 'SITA - Despacho'); return false;" class="btn-voltar-home">📤 Despacho</a>
            <button class="btn-limpar-filtros" onclick="SitaIndex.abrirImportarLote()">📥 Importar Lote</button>
            <button class="btn-filtrar" onclick="SitaIndex.abrirNovaObra()">➕ Nova Obra</button>
        </div>
    </div>

    <div class="sita-toolbar">
        <div class="sita-view-toggle">
            <button class="view-btn active" data-view="semanal" onclick="SitaIndex.mudarVisao('semanal')">Semanal</button>
            <button class="view-btn" data-view="mensal" onclick="SitaIndex.mudarVisao('mensal')">Mensal</button>
        </div>

        <div class="sita-nav">
            <button onclick="SitaIndex.navegar(-1)">◀</button>
            <span id="sitaPeriodo">...</span>
            <button onclick="SitaIndex.navegar(1)">▶</button>
            <button onclick="SitaIndex.irHoje()">Hoje</button>
        </div>

        <label class="sita-check-inline">
            <input type="checkbox" id="sitaOcultarArq" onchange="SitaIndex.render()">
            <span>Ocultar arquivados</span>
        </label>

        <div class="sita-busca">
            <input type="text" id="sitaBusca" placeholder="🔍 Buscar obra..." oninput="SitaIndex.buscar(this.value)">
            <div id="sitaBuscaResultados" class="busca-resultados"></div>
        </div>
    </div>

    <div id="sitaCalendario" class="sita-calendario"></div>
    <div id="sitaLegenda" class="sita-legenda"></div>
</div>

<!-- Modal Nova Obra -->
<div id="modalNovaObra" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-head">
            <h3>➕ Nova Obra</h3>
            <button class="btn-fechar" onclick="SitaIndex.fecharNovaObra()">✕</button>
        </div>
        <div class="modal-body">
            <label>Nº da Obra *</label>
            <input type="text" id="novaObraNumero" placeholder="0012501791">

            <label>Data Programada *</label>
            <input type="date" id="novaObraData" onchange="SitaIndex.aoMudarData()">

            <div id="novaObraAviso" class="nova-obra-aviso" style="display:none"></div>

            <label>Encarregado</label>
            <select id="novaObraEncarregado" onchange="SitaIndex.aoMudarEncarregado()">
                <option value="">Selecione...</option>
            </select>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                <div>
                    <label>Matrícula</label>
                    <input type="text" id="novaObraMatricula" readonly>
                </div>
                <div>
                    <label>Equipe</label>
                    <input type="text" id="novaObraEquipe" readonly>
                </div>
            </div>

            <label>Observação inicial</label>
            <textarea id="novaObraObs" rows="3" placeholder="Opcional"></textarea>
        </div>
        <div class="modal-foot">
            <button class="btn-limpar-filtros" onclick="SitaIndex.fecharNovaObra()">Cancelar</button>
            <button class="btn-filtrar" onclick="SitaIndex.salvarNovaObra()">Salvar</button>
        </div>
    </div>
</div>

<!-- Modal Importar Lote -->
<div id="modalImportarLote" class="modal-overlay">
    <div class="modal-box" style="max-width:640px">
        <div class="modal-head">
            <h3>📥 Importar Lote</h3>
            <button class="btn-fechar" onclick="SitaIndex.fecharImportarLote()">✕</button>
        </div>
        <div class="modal-body">
            <div class="lote-hint">
                Cole as colunas do Excel abaixo (separadas por <strong>TAB</strong>):<br>
                <code>Nº Obra</code> | <code>Data (dd/mm/aaaa)</code> | <code>Obs (opcional)</code>
                <br><br>
                <strong>⚠️ Obras com data em até 10 dias serão marcadas automaticamente como FORA DA PROGRAMAÇÃO.</strong>
            </div>
            <textarea id="loteTexto" class="lote-textarea" placeholder="0012501791	03/01/2026	Obs aqui...
0012501792	15/02/2026"></textarea>
            <div id="loteResultado"></div>
        </div>
        <div class="modal-foot">
            <button class="btn-limpar-filtros" onclick="SitaIndex.fecharImportarLote()">Fechar</button>
            <button class="btn-filtrar" onclick="SitaIndex.processarImportarLote()">📥 Processar</button>
        </div>
    </div>
</div>

<div id="sitaToast" class="sita-toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/firebase-init.js"></script>
<script src="../js/config.js"></script>
<script src="../js/auth-service.js"></script>
<script src="../js/sita.js"></script>
</body>
</html>
