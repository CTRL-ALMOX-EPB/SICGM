<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITA — Programação</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/sita-index.css">
</head>
<body>
<div class="sita-app">
    <header class="sita-header">
        <div class="sita-header-left">
            <img src="../assests/img/logo-control.png" alt="Control" class="sita-logo" onerror="this.style.display='none'">
            <h1>SITA <small>Programação</small></h1>
        </div>
        <div class="sita-header-right">
            <a href="#" onclick="abrirSubSita('esteira.html', 'SITA - Esteira'); return false;" class="sita-btn-outline">🚦 Esteira</a>
            <a href="#" onclick="abrirSubSita('despacho.html', 'SITA - Despacho'); return false;" class="sita-btn-outline">📤 Despacho</a>
            <button class="sita-btn-primary" onclick="abrirNovaObra()">➕ Nova Obra</button>
        </div>
    </header>

    <div class="sita-toolbar">
        <div class="sita-view-toggle">
            <button class="view-btn active" data-view="semanal" onclick="mudarVisao('semanal')">Semanal</button>
            <button class="view-btn" data-view="mensal" onclick="mudarVisao('mensal')">Mensal</button>
        </div>

        <div class="sita-nav">
            <button onclick="navegar(-1)">◀</button>
            <span id="sitaPeriodo">...</span>
            <button onclick="navegar(1)">▶</button>
            <button onclick="irHoje()">Hoje</button>
        </div>

        <div class="sita-busca">
            <input type="text" id="sitaBusca" placeholder="🔍 Buscar obra..." oninput="buscar(this.value)">
            <div id="sitaBuscaResultados" class="busca-resultados"></div>
        </div>
    </div>

    <div id="sitaCalendario" class="sita-calendario"></div>

    <div id="sitaLegenda" class="sita-legenda"></div>
</div>

<!-- Modal nova obra -->
<div id="modalNovaObra" class="sita-modal-overlay">
    <div class="sita-modal">
        <div class="sita-modal-header">
            <h3>➕ Nova Obra</h3>
            <button onclick="fecharNovaObra()">✕</button>
        </div>
        <div class="sita-modal-body">
            <label>Nº da Obra *</label>
            <input type="text" id="novaObraNumero" placeholder="0012501791">

            <label>Data Programada *</label>
            <input type="date" id="novaObraData">

            <label>Encarregado</label>
            <input type="text" id="novaObraEncarregado" placeholder="Nome do encarregado">

            <label>Observação inicial</label>
            <textarea id="novaObraObs" rows="3" placeholder="Opcional"></textarea>

            <label class="sita-check">
                <input type="checkbox" id="novaObraUrgente">
                <span>Fora da Programação</span>
            </label>
        </div>
        <div class="sita-modal-footer">
            <button class="sita-btn-outline" onclick="fecharNovaObra()">Cancelar</button>
            <button class="sita-btn-primary" onclick="salvarNovaObra()">Salvar</button>
        </div>
    </div>
</div>

<div id="sitaToast" class="sita-toast"></div>

<script src="../js/auth-service.js"></script>
<script src="../js/sita-config.js"></script>
<script src="../js/sita-auth.js"></script>
<script src="../js/sita-api.js"></script>
<script src="../js/sita-nav.js"></script>
<script src="../js/sita-index.js"></script>
</body>
</html>
