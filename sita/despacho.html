<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITA — Despacho</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/sita-despacho.css">
</head>
<body>
<div class="sita-app">
    <header class="sita-header">
        <h1>📤 Despacho <small>envia etapa 2 → 3</small></h1>
        <a href="#" onclick="abrirSubSita('index.html', 'SITA'); return false;" class="sita-btn-outline">← Voltar</a>
    </header>

    <div class="despacho-toolbar">
        <label>Data de programação:</label>
        <input type="date" id="despachoData" onchange="render()">
        <span id="despachoTotal"></span>
    </div>

    <div class="despacho-grid">
        <div class="despacho-col">
            <h2>📋 Lista de Separação (etapa 2)</h2>
            <div id="despachoLista" class="despacho-lista"></div>
        </div>
        <div class="despacho-col">
            <h2>👷 Separadores</h2>
            <div id="despachoListaSeparadores" class="despacho-lista-separadores"></div>
        </div>
    </div>
</div>

<script src="../js/auth-service.js"></script>
<script src="../js/sita-config.js"></script>
<script src="../js/sita-auth.js"></script>
<script src="../js/sita-api.js"></script>
<script src="../js/sita-nav.js"></script>
<script src="../js/sita-despacho.js"></script>
</body>
</html>
