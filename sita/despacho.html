<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITA — Despacho</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/sita.css">
</head>
<body data-page="despacho">
<div class="sita-app">
    <div class="page-header">
        <div class="header-left">
            <img src="../assests/img/logo-control.png" alt="Control" class="logo-empresa" onerror="this.style.display='none'">
            <h1>📤 Despacho <small>envia etapa 2 → 3</small></h1>
        </div>
    </div>

    <div class="despacho-toolbar">
        <label>Data de programação:</label>
        <input type="date" id="despachoData" onchange="SitaDespacho.render()">
        <span id="despachoTotal"></span>
    </div>

    <div class="despacho-grid">
        <div class="despacho-col">
            <h2>📋 Lista de Separação (etapa 2)</h2>
            <div id="despachoLista" class="despacho-lista"></div>
        </div>
        <div class="despacho-col">
            <h2>👷 Separadores</h2>
            <div id="despachoListaSeparadores" class="despacho-lista-separadores"></div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/firebase-init.js"></script>
<script src="../js/config.js"></script>
<script src="../js/auth-service.js"></script>
<script src="../js/sita.js"></script>
</body>
</html>
