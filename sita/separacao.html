<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITA — Separação</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/sita.css">
</head>
<body data-page="separacao">
<div class="sita-app">
    <div class="page-header">
        <div class="header-left">
            <img src="../assests/img/logo-control.png" alt="Control" class="logo-empresa" onerror="this.style.display='none'">
            <h1>📦 Separação <small>minhas obras</small></h1>
        </div>
    </div>

    <div id="sepHint" class="sep-hint" style="display:none;"></div>
    <div id="sepLista" class="sep-lista"></div>

    <!-- Drawer lateral -->
    <div id="sepDrawer" class="sep-drawer" style="display:none;">
        <div class="sep-drawer-inner" id="sepDrawerInner"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/firebase-init.js"></script>
<script src="../js/config.js"></script>
<script src="../js/auth-service.js"></script>
<script src="../js/sita.js"></script>
</body>
</html>
