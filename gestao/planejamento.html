<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planejamento</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/gestao.css">
    <style>
        .gestao-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-timer {
            display: flex;
            align-items: center;
            gap: 15px;
        }
    </style>
</head>
<body>
    <div class="gestao-container">
        <div class="gestao-header">
            <h1>📅 Planejamento</h1>
            <div class="header-timer">
                <div class="session-timer-wrapper">
                    <span class="timer-icon">⏱️</span>
                    <span class="timer-label">Sessão:</span>
                    <span id="sessionTimer">30:00</span>
                    <span class="timer-status">(ativa)</span>
                </div>
                <button class="btn-voltar" onclick="navigateTo('gestao/index.html')">⬅ Voltar</button>
            </div>
        </div>
        <div style="background: #1E293B; padding: 40px; border-radius: 12px; text-align: center;">
            <p style="font-size: 18px; color: #94A3B8;">Em breve: metas, orçamento e cronogramas.</p>
        </div>
    </div>
    <!-- ============================================ -->
    <!-- 🔥 FIREBASE SDK                              -->
    <!-- ============================================ -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <!-- ============================================ -->
    <!-- 🔥 CONFIGURAÇÕES DO SISTEMA (ORDEM IMPORTA!) -->
    <!-- ============================================ -->
    <script src="../js/firebase-config.js"></script>   
    <script src="../js/config.js"></script>  
    <script src="../js/auth-service.js"></script>      
    <script src="../js/auth-helper.js"></script>  
    <script src="../js/timer.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/auth-global.js"></script>  
    <Script src="../js/login.js"></script>
</body>
</html>
