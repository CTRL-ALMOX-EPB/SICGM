<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - SICGM (Gestão)</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/home-gestao.css">
    <link rel="stylesheet" href="./css/chamados.css">
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">Validando acesso...</div>
    </div>

    <div class="home-container" id="homeContent" style="display: none;">
        <div class="home-header">
            <h1>🏢 SICGM - Gestão</h1>
            <div class="user-info">
                <div class="user-details">
                    <div class="user-name" id="nomeUsuario">Carregando...</div>
                    <div class="user-matricula" id="matriculaUsuario">Matrícula: ---</div>
                </div>
                <div class="user-actions">
                    <a href="gestao/admin.html" class="btn-admin-header">👑 Admin</a>
                    <span class="user-perfil" id="perfilUsuario">GESTÃO</span>
                    <button class="btn-sair" onclick="sair()">🚪 Sair</button>
                </div>
            </div>
        </div>

        <div class="welcome-card">
            <h2 id="mensagemBoasVindas">Bem-vindo ao SICGM!</h2>
            <p>Você está logado como <strong>Gestão</strong>. Selecione um departamento abaixo para acessar suas funções.</p>
        </div>

        <div class="departamentos-bar" id="departamentosBar">
            <button class="departamento-btn" data-depto="GESTAO" onclick="selecionarDepartamento('GESTAO')">GESTÃO</button>
            <button class="departamento-btn active" data-depto="DCMD" onclick="selecionarDepartamento('DCMD')">DCMD</button>
            <button class="departamento-btn" data-depto="DMPC" onclick="selecionarDepartamento('DMPC')">DMPC</button>
            <button class="departamento-btn" data-depto="DECP" onclick="selecionarDepartamento('DECP')">DECP</button>
            <button class="departamento-btn" data-depto="DEOP" onclick="selecionarDepartamento('DEOP')">DEOP</button>
        </div>

        <div class="depto-content" id="deptoContent"></div>

        <div class="restricted-msg">
            ✅ Perfil <strong>Gestão</strong> - Acesso completo a todos os departamentos e funções.
        </div>
    </div>

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <!-- ORDEM CORRETA DOS SCRIPTS -->
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth-service.js"></script>
    <script src="js/auth-helper.js"></script>
    <script src="js/script.js"></script>
    <script src="js/auth-global.js"></script>
    <script src="js/home-gestao.js"></script>
    <script src="./js/chamados.js" defer></script>
</body>
</html>
