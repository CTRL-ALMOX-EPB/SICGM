<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - SICGM (Gestão)</title>
    
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/home-gestao.css">
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">Validando acesso...</div>
    </div>

    <div class="home-container" id="homeContent" style="display: none;">
        <!-- Header -->
        <div class="home-header">
            <h1>🏢 SICGM - Gestão</h1>
            <div class="user-info">
                <div>
                    <div class="user-name" id="nomeUsuario">Carregando...</div>
                    <div class="user-matricula" id="matriculaUsuario">Matrícula: ---</div>
                    <div style="font-size: 12px; color: #718096; margin-top: 4px;">
                        ⏰ Sessão expira em: <span id="sessionTimer">30 minutos</span>
                    </div>
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <a href="gestao/admin.html" class="btn-admin-header" style="
                        background: #9F7AEA;
                        color: white;
                        padding: 8px 16px;
                        border-radius: 8px;
                        text-decoration: none;
                        font-size: 13px;
                        font-weight: 600;
                        transition: background 0.3s;
                    ">👑 Admin</a>
                    <span class="user-perfil" id="perfilUsuario">GESTÃO</span>
                    <button class="btn-sair" onclick="sair()">🚪 Sair</button>
                </div>
            </div>
        </div>

        <!-- Welcome Card -->
        <div class="welcome-card">
            <h2 id="mensagemBoasVindas">Bem-vindo ao SICGM!</h2>
            <p>Você está logado como <strong>Gestão</strong>. Selecione um departamento abaixo para acessar suas funções.</p>
        </div>

        <!-- Barra de Departamentos -->
        <div class="departamentos-bar" id="departamentosBar">
            <button class="departamento-btn" data-depto="GESTAO" onclick="selecionarDepartamento('GESTAO')">
                GESTÃO
            </button>
            <button class="departamento-btn active" data-depto="DCMD" onclick="selecionarDepartamento('DCMD')">
                DCMD
            </button>
            <button class="departamento-btn" data-depto="DMPC" onclick="selecionarDepartamento('DMPC')">
                DMPC
            </button>
            <button class="departamento-btn" data-depto="DECP" onclick="selecionarDepartamento('DECP')">
                DECP
            </button>
            <button class="departamento-btn" data-depto="DEOP" onclick="selecionarDepartamento('DEOP')">
                DEOP
            </button>
        </div>

        <!-- Área de Conteúdo -->
        <div class="depto-content" id="deptoContent">
            <!-- Renderizado via JavaScript -->
        </div>

        <div class="restricted-msg">
            ✅ Perfil <strong>Gestão</strong> - Acesso completo a todos os departamentos e funções.
        </div>
    </div>

    <!-- ============================================ -->
    <!-- 🔥 FIREBASE CONFIG - INJETADO PELO WORKFLOW -->
    <!-- ============================================ -->
    <script>
        // 🔥 Estas variáveis serão substituídas pelo workflow
        window.FIREBASE_CONFIG = {
            apiKey: 'SUBSTITUIR_API_KEY',
            authDomain: 'SUBSTITUIR_AUTH_DOMAIN',
            projectId: 'SUBSTITUIR_PROJECT_ID',
            storageBucket: 'SUBSTITUIR_STORAGE_BUCKET',
            messagingSenderId: 'SUBSTITUIR_SENDER_ID',
            appId: 'SUBSTITUIR_APP_ID'
        };
        console.log('✅ FIREBASE_CONFIG carregado');
    </script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <!-- Configurações -->
    <script src="js/firebase-init.js"></script>
    <script src="js/auth-service.js"></script>
    <script src="js/auth-global.js"></script>
    <script src="js/script.js"></script>
    <script src="js/home-gestao.js"></script>
</body>
</html>
