<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - SICGM (Gestão)</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/home-gestao.css">
    <link rel="stylesheet" href="./css/chamados.css">

    <style>
        /* ═══════════ SISTEMA DE ABAS ═══════════ */
        #tab-bar {
            display: flex;
            align-items: flex-end;
            background: #2D3748;
            padding: 6px 6px 0 6px;
            gap: 3px;
            overflow-x: auto;
            border-radius: 10px 10px 0 0;
            margin-top: 20px;
            min-height: 42px;
        }
        #tab-bar .tab {
            padding: 8px 14px;
            background: #4A5568;
            color: #E2E8F0;
            border: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            font-size: 13px;
            font-family: inherit;
            transition: background 0.15s;
        }
        #tab-bar .tab:hover { background: #5A6578; }
        #tab-bar .tab.active { background: #F7FAFC; color: #1A202C; font-weight: 600; }
        #tab-bar .tab.active:hover { background: #F7FAFC; }
        #tab-bar .tab-close {
            font-weight: 700;
            padding: 0 4px;
            border-radius: 50%;
            background: rgba(0,0,0,0.15);
            line-height: 1;
            font-size: 14px;
        }
        #tab-bar .tab-close:hover { background: rgba(0,0,0,0.35); }

        #content-area {
            position: relative;
            background: #F7FAFC;
            border-radius: 0 0 10px 10px;
            overflow: hidden;
            min-height: 300px;
        }
        #content-area .aba-conteudo { padding: 20px; }
        #content-area .iframe-container {
            position: absolute;
            inset: 0;
            display: none;
        }
        #content-area .iframe-container.active { display: block; }
        #content-area .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        /* Quando há um iframe ativo, a área de conteúdo cresce */
        #content-area.tem-iframe-ativo {
            height: 75vh;
        }
        #content-area.tem-iframe-ativo .aba-conteudo {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">Validando acesso...</div>
    </div>

    <div class="home-container" id="homeContent" style="display: none;">
        <div class="home-header">
            <h1>🏢 SICGM - Gestão</h1>
            <div class="user-info">
                <div class="user-details">
                    <div class="user-name" id="nomeUsuario">Carregando...</div>
                    <div class="user-matricula" id="matriculaUsuario">Matrícula: ---</div>
                </div>
                <div class="user-actions">
                    <a href="gestao/admin.html" class="btn-admin-header">👑 Admin</a>
                    <span class="user-perfil" id="perfilUsuario">GESTÃO</span>
                    <button class="btn-sair" onclick="sair()">🚪 Sair</button>
                </div>
            </div>
        </div>

        <div class="welcome-card">
            <h2 id="mensagemBoasVindas">Bem-vindo ao SICGM!</h2>
            <p>Você está logado como <strong>Gestão</strong>. Selecione um departamento abaixo para acessar suas funções.</p>
        </div>

        <div class="departamentos-bar" id="departamentosBar">
            <button class="departamento-btn" data-depto="GESTAO" onclick="selecionarDepartamento('GESTAO')">GESTÃO</button>
            <button class="departamento-btn active" data-depto="DCMD" onclick="selecionarDepartamento('DCMD')">DCMD</button>
            <button class="departamento-btn" data-depto="DMPC" onclick="selecionarDepartamento('DMPC')">DMPC</button>
            <button class="departamento-btn" data-depto="DECP" onclick="selecionarDepartamento('DECP')">DECP</button>
            <button class="departamento-btn" data-depto="DEOP" onclick="selecionarDepartamento('DEOP')">DEOP</button>
        </div>

        <!-- ═══════════ SISTEMA DE ABAS ═══════════ -->
        <div id="tab-bar"></div>

        <div id="content-area">
            <!-- Aba "Início": contém o conteúdo de departamentos (comportamento atual da home) -->
            <div class="aba-conteudo" data-aba-conteudo="inicio" style="display:block;">
                <div class="depto-content" id="deptoContent"></div>

                <div class="restricted-msg">
                    ✅ Perfil <strong>Gestão</strong> - Acesso completo a todos os departamentos e funções.
                </div>
            </div>
            <!-- Os iframes das outras abas são injetados aqui pelo gerenciador-abas.js -->
        </div>
    </div>

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <!-- ORDEM CORRETA DOS SCRIPTS -->
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth-service.js"></script>
    <script src="js/auth-helper.js"></script>
    <script src="js/script.js"></script>
    <script src="js/auth-global.js"></script>
    <script src="js/home-gestao.js"></script>
    <script src="./js/chamados.js" defer></script>
    <script src="./js/gerenciador-abas.js" defer></script>
    <script src="./js/iframe-nav.js" defer></script>
</body>
</html>
