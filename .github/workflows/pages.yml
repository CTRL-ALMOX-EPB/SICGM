name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      # ============================================
      # 🔥 CRIAR firebase-config.js A PARTIR DO MODELO
      # ============================================
      - name: Criar firebase-config.js
        run: |
          echo "📁 Criando firebase-config.js a partir do modelo..."
          
          # 🔥 Copiar o modelo
          if [ -f "js/firebase-config.example.js" ]; then
            cp js/firebase-config.example.js js/firebase-config.js
            echo "✅ Modelo copiado!"
          else
            echo "❌ ERRO: firebase-config.example.js não encontrado!"
            exit 1
          fi
          
          # 🔥 Substituir placeholders pelos Secrets
          echo "🔧 Substituindo placeholders pelos Secrets..."
          
          # Substituir cada placeholder
          sed -i "s/SUA_API_KEY_AQUI/${{ secrets.FIREBASE_API_KEY }}/g" js/firebase-config.js
          sed -i "s/SEU_PROJETO.firebaseapp.com/${{ secrets.FIREBASE_AUTH_DOMAIN }}/g" js/firebase-config.js
          sed -i "s/SEU_PROJETO/${{ secrets.FIREBASE_PROJECT_ID }}/g" js/firebase-config.js
          sed -i "s/SEU_PROJETO.appspot.com/${{ secrets.FIREBASE_STORAGE_BUCKET }}/g" js/firebase-config.js
          sed -i "s/SEU_SENDER_ID/${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}/g" js/firebase-config.js
          sed -i "s/SEU_APP_ID/${{ secrets.FIREBASE_APP_ID }}/g" js/firebase-config.js
          
          echo "✅ firebase-config.js criado com sucesso!"
      
      # ============================================
      # 🔥 VERIFICAR O ARQUIVO
      # ============================================
      - name: Verificar firebase-config.js
        run: |
          echo "========================================="
          echo "📁 VERIFICANDO firebase-config.js"
          echo "========================================="
          if [ -f "js/firebase-config.js" ]; then
            echo "✅ Arquivo criado com sucesso!"
            echo ""
            echo "📄 PRIMEIRAS LINHAS (seguro):"
            echo "-----------------------------------------"
            head -n 15 js/firebase-config.js
            echo "-----------------------------------------"
          else
            echo "❌ ERRO: firebase-config.js não foi criado!"
            exit 1
          fi
      
      # ============================================
      # 🔥 VERIFICAR OUTROS ARQUIVOS
      # ============================================
      - name: Verify required files
        run: |
          echo "📁 Verificando arquivos necessários..."
          if [ ! -f "index.html" ]; then
            echo "❌ ERRO: index.html não encontrado!"
            exit 1
          fi
          echo "✅ index.html encontrado"
          
          if [ ! -d "js" ]; then
            echo "⚠️ Aviso: Pasta 'js' não encontrada"
          else
            echo "✅ Pasta 'js' encontrada"
            echo "📁 Arquivos em js/:"
            ls -la js/
          fi
      
      # ============================================
      # 🔥 UPLOAD DO ARTEFATO
      # ============================================
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          name: github-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages