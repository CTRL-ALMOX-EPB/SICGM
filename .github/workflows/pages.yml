name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      # ============================================
      # 🔥 CRIAR firebase-config.js (NÃO ESTÁ NO REPO!)
      # ============================================
      - name: Criar firebase-config.js
        run: |
          echo "📁 Criando firebase-config.js a partir dos Secrets..."
          
          # Criar a pasta js/ se não existir
          mkdir -p js
          
          # Criar o arquivo com os dados dos Secrets
          cat > js/firebase-config.js << 'EOF'
          // ============================================
          // FIREBASE CONFIG - GERADO PELO WORKFLOW
          // ============================================
          const firebaseConfig = {
              apiKey: 'SUBSTITUIR_API_KEY',
              authDomain: 'SUBSTITUIR_AUTH_DOMAIN',
              projectId: 'SUBSTITUIR_PROJECT_ID',
              storageBucket: 'SUBSTITUIR_STORAGE_BUCKET',
              messagingSenderId: 'SUBSTITUIR_SENDER_ID',
              appId: 'SUBSTITUIR_APP_ID'
          };
          firebase.initializeApp(firebaseConfig);
          const auth = firebase.auth();
          auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
          console.log('🔥 Firebase inicializado com sucesso!');
          EOF
          
          # Substituir os placeholders pelos Secrets
          sed -i "s|SUBSTITUIR_API_KEY|${{ secrets.FIREBASE_API_KEY }}|g" js/firebase-config.js
          sed -i "s|SUBSTITUIR_AUTH_DOMAIN|${{ secrets.FIREBASE_AUTH_DOMAIN }}|g" js/firebase-config.js
          sed -i "s|SUBSTITUIR_PROJECT_ID|${{ secrets.FIREBASE_PROJECT_ID }}|g" js/firebase-config.js
          sed -i "s|SUBSTITUIR_STORAGE_BUCKET|${{ secrets.FIREBASE_STORAGE_BUCKET }}|g" js/firebase-config.js
          sed -i "s|SUBSTITUIR_SENDER_ID|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g" js/firebase-config.js
          sed -i "s|SUBSTITUIR_APP_ID|${{ secrets.FIREBASE_APP_ID }}|g" js/firebase-config.js
          
          echo "✅ firebase-config.js criado com sucesso!"
          
          # 🔥 VERIFICAR O CONTEÚDO (seguro - só as primeiras linhas)
          echo ""
          echo "📄 Primeiras linhas do firebase-config.js:"
          head -n 10 js/firebase-config.js
      
      # ============================================
      # 🔥 VERIFICAR SE O ARQUIVO FOI CRIADO
      # ============================================
      - name: Verificar firebase-config.js
        run: |
          echo "========================================="
          echo "📁 VERIFICANDO firebase-config.js"
          echo "========================================="
          if [ -f "js/firebase-config.js" ]; then
            echo "✅ firebase-config.js existe!"
            echo ""
            echo "📄 Tamanho do arquivo: $(wc -c < js/firebase-config.js) bytes"
            echo ""
            echo "📄 Verificando se placeholders foram substituídos:"
            if grep -q "SUBSTITUIR" js/firebase-config.js; then
              echo "❌ ERRO: Ainda há placeholders no arquivo!"
              exit 1
            else
              echo "✅ Todos os placeholders foram substituídos!"
            fi
          else
            echo "❌ ERRO: firebase-config.js NÃO foi criado!"
            exit 1
          fi
      
      # ============================================
      # 🔥 VERIFICAR OUTROS ARQUIVOS
      # ============================================
      - name: Listar arquivos
        run: |
          echo "📁 Conteúdo da pasta js/:"
          ls -la js/
      
      # ============================================
      # 🔥 UPLOAD PARA O SITE
      # ============================================
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          name: github-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages