name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # ============================================
      # 🔥 INJETAR FIREBASE CONFIG NOS ARQUIVOS
      # ============================================
      - name: Injetar Firebase Config
        run: |
          echo "📁 Injetando Firebase Config..."
          
          echo "🔍 Verificando Secrets..."
          if [ -z "${{ secrets.FIREBASE_API_KEY }}" ]; then
            echo "❌ FIREBASE_API_KEY NÃO configurado!"
            exit 1
          fi
          echo "✅ FIREBASE_API_KEY configurado"

          # 🔥 Função helper: só processa o arquivo SE ele existir
          processar() {
            local arquivo="$1"
            if [ ! -f "$arquivo" ]; then
              echo "⏭️  $arquivo não existe, pulando..."
              return 0
            fi
            echo "🔧 Processando $arquivo..."
            sed -i "s|SUBSTITUIR_API_KEY|${{ secrets.FIREBASE_API_KEY }}|g" "$arquivo"
            sed -i "s|SUBSTITUIR_AUTH_DOMAIN|${{ secrets.FIREBASE_AUTH_DOMAIN }}|g" "$arquivo"
            sed -i "s|SUBSTITUIR_PROJECT_ID|${{ secrets.FIREBASE_PROJECT_ID }}|g" "$arquivo"
            sed -i "s|SUBSTITUIR_STORAGE_BUCKET|${{ secrets.FIREBASE_STORAGE_BUCKET }}|g" "$arquivo"
            sed -i "s|SUBSTITUIR_SENDER_ID|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g" "$arquivo"
            sed -i "s|SUBSTITUIR_APP_ID|${{ secrets.FIREBASE_APP_ID }}|g" "$arquivo"
            echo "✅ $arquivo processado"
          }

          # ═══════════════════════════════════════════
          # Lista de arquivos que DEVEM ter os placeholders
          # Adicione/remova conforme sua estrutura
          # ═══════════════════════════════════════════
          processar "login.html"
          processar "home-unificada.html"
          processar "gestao/admin.html"
          processar "index.htm"

          # ═══════════════════════════════════════════
          # 🔥 Também processa o firebase-config.js
          # (caso os placeholders estejam lá em vez dos HTMLs)
          # ═══════════════════════════════════════════
          if [ -f "js/firebase-config.js" ]; then
            echo "🔧 Processando js/firebase-config.js..."
            sed -i "s|SUBSTITUIR_API_KEY|${{ secrets.FIREBASE_API_KEY }}|g" "js/firebase-config.js"
            sed -i "s|SUBSTITUIR_AUTH_DOMAIN|${{ secrets.FIREBASE_AUTH_DOMAIN }}|g" "js/firebase-config.js"
            sed -i "s|SUBSTITUIR_PROJECT_ID|${{ secrets.FIREBASE_PROJECT_ID }}|g" "js/firebase-config.js"
            sed -i "s|SUBSTITUIR_STORAGE_BUCKET|${{ secrets.FIREBASE_STORAGE_BUCKET }}|g" "js/firebase-config.js"
            sed -i "s|SUBSTITUIR_SENDER_ID|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g" "js/firebase-config.js"
            sed -i "s|SUBSTITUIR_APP_ID|${{ secrets.FIREBASE_APP_ID }}|g" "js/firebase-config.js"
            echo "✅ js/firebase-config.js processado"
          else
            echo "⏭️  js/firebase-config.js não existe, pulando..."
          fi

          echo ""
          echo "✅ Todos os arquivos existentes foram processados!"

      # ============================================
      # 🔥 VERIFICAR SE FUNCIONOU
      # ============================================
      - name: Verificar substituição
        run: |
          echo "========================================="
          echo "📁 VERIFICANDO substituição"
          echo "========================================="

          ERROS=0

          # Só verifica arquivos que existem
          verificar() {
            local arquivo="$1"
            if [ ! -f "$arquivo" ]; then
              echo "⏭️  $arquivo não existe (skip)"
              return 0
            fi
            if grep -q "SUBSTITUIR_API_KEY" "$arquivo" 2>/dev/null; then
              echo "❌ ERRO: $arquivo ainda tem placeholders!"
              ERROS=$((ERROS+1))
            else
              echo "✅ $arquivo OK"
            fi
          }

          verificar "login.html"
          verificar "home-unificada.html"
          verificar "gestao/admin.html"
          verificar "index.htm"
          verificar "js/firebase-config.js"

          if [ $ERROS -gt 0 ]; then
            echo ""
            echo "❌ $ERROS arquivo(s) com placeholders não substituídos"
            exit 1
          fi

          echo ""
          echo "✅ Todos os arquivos verificados com sucesso!"

      # ============================================
      # 🔥 UPLOAD
      # ============================================
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          name: github-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages