name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      # ============================================
      # 🔥 CRIAR FIREBASE-CONFIG.JS COM SECRETS
      # ============================================
      - name: Criar firebase-config.js
        run: |
          echo "📁 Criando firebase-config.js..."
          echo "// ============================================" > js/firebase-config.js
          echo "// FIREBASE CONFIG - GERADO AUTOMATICAMENTE" >> js/firebase-config.js
          echo "// ============================================" >> js/firebase-config.js
          echo "" >> js/firebase-config.js
          echo "const firebaseConfig = {" >> js/firebase-config.js
          echo "    apiKey: '${{ secrets.FIREBASE_API_KEY }}'," >> js/firebase-config.js
          echo "    authDomain: '${{ secrets.FIREBASE_AUTH_DOMAIN }}'," >> js/firebase-config.js
          echo "    projectId: '${{ secrets.FIREBASE_PROJECT_ID }}'," >> js/firebase-config.js
          echo "    storageBucket: '${{ secrets.FIREBASE_STORAGE_BUCKET }}'," >> js/firebase-config.js
          echo "    messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}'," >> js/firebase-config.js
          echo "    appId: '${{ secrets.FIREBASE_APP_ID }}'" >> js/firebase-config.js
          echo "};" >> js/firebase-config.js
          echo "" >> js/firebase-config.js
          echo "// Inicializar Firebase" >> js/firebase-config.js
          echo "firebase.initializeApp(firebaseConfig);" >> js/firebase-config.js
          echo "const auth = firebase.auth();" >> js/firebase-config.js
          echo "auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);" >> js/firebase-config.js
          echo "console.log('🔥 Firebase inicializado com sucesso!');" >> js/firebase-config.js
          echo "✅ firebase-config.js criado!"
      
      # ============================================
      # 🔥 VERIFICAR SE O ARQUIVO FOI CRIADO
      # ============================================
      - name: Verificar firebase-config.js
        run: |
          echo "========================================="
          echo "📁 VERIFICANDO firebase-config.js"
          echo "========================================="
          if [ -f "js/firebase-config.js" ]; then
            echo "✅ Arquivo criado com sucesso!"
            echo ""
            echo "📄 CONTEÚDO DO ARQUIVO:"
            echo "-----------------------------------------"
            cat js/firebase-config.js
            echo "-----------------------------------------"
          else
            echo "❌ ERRO: firebase-config.js não foi criado!"
            echo "📁 Conteúdo da pasta js/:"
            ls -la js/
            exit 1
          fi
      
      # ============================================
      # 🔥 VERIFICAR OUTROS ARQUIVOS
      # ============================================
      - name: Verify required files
        run: |
          echo "📁 Verificando arquivos necessários..."
          if [ ! -f "index.html" ]; then
            echo "❌ ERRO: index.html não encontrado!"
            exit 1
          fi
          echo "✅ index.html encontrado"
          
          if [ ! -d "css" ]; then
            echo "⚠️ Aviso: Pasta 'css' não encontrada"
          else
            echo "✅ Pasta 'css' encontrada"
          fi
          
          if [ ! -d "js" ]; then
            echo "⚠️ Aviso: Pasta 'js' não encontrada"
          else
            echo "✅ Pasta 'js' encontrada"
            echo "📁 Arquivos em js/:"
            ls -la js/
          fi
      
      # ============================================
      # 🔥 UPLOAD DO ARTEFATO
      # ============================================
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          name: github-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages