name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      # ============================================
      # 🔥 INJETAR FIREBASE CONFIG NOS HTMLs
      # ============================================
      - name: Injetar Firebase Config nos HTMLs
        run: |
          echo "📁 Injetando Firebase Config..."
          
          # Substituir no login.html
          echo "🔧 Processando login.html..."
          sed -i "s/SUBSTITUIR_API_KEY/${{ secrets.FIREBASE_API_KEY }}/g" login.html
          sed -i "s/SUBSTITUIR_AUTH_DOMAIN/${{ secrets.FIREBASE_AUTH_DOMAIN }}/g" login.html
          sed -i "s/SUBSTITUIR_PROJECT_ID/${{ secrets.FIREBASE_PROJECT_ID }}/g" login.html
          sed -i "s/SUBSTITUIR_STORAGE_BUCKET/${{ secrets.FIREBASE_STORAGE_BUCKET }}/g" login.html
          sed -i "s/SUBSTITUIR_SENDER_ID/${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}/g" login.html
          sed -i "s/SUBSTITUIR_APP_ID/${{ secrets.FIREBASE_APP_ID }}/g" login.html
          
          # Substituir no home-gestao.html
          echo "🔧 Processando home-gestao.html..."
          sed -i "s/SUBSTITUIR_API_KEY/${{ secrets.FIREBASE_API_KEY }}/g" home-gestao.html
          sed -i "s/SUBSTITUIR_AUTH_DOMAIN/${{ secrets.FIREBASE_AUTH_DOMAIN }}/g" home-gestao.html
          sed -i "s/SUBSTITUIR_PROJECT_ID/${{ secrets.FIREBASE_PROJECT_ID }}/g" home-gestao.html
          sed -i "s/SUBSTITUIR_STORAGE_BUCKET/${{ secrets.FIREBASE_STORAGE_BUCKET }}/g" home-gestao.html
          sed -i "s/SUBSTITUIR_SENDER_ID/${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}/g" home-gestao.html
          sed -i "s/SUBSTITUIR_APP_ID/${{ secrets.FIREBASE_APP_ID }}/g" home-gestao.html
          
          # Substituir no admin.html
          echo "🔧 Processando gestao/admin.html..."
          sed -i "s/SUBSTITUIR_API_KEY/${{ secrets.FIREBASE_API_KEY }}/g" gestao/admin.html
          sed -i "s/SUBSTITUIR_AUTH_DOMAIN/${{ secrets.FIREBASE_AUTH_DOMAIN }}/g" gestao/admin.html
          sed -i "s/SUBSTITUIR_PROJECT_ID/${{ secrets.FIREBASE_PROJECT_ID }}/g" gestao/admin.html
          sed -i "s/SUBSTITUIR_STORAGE_BUCKET/${{ secrets.FIREBASE_STORAGE_BUCKET }}/g" gestao/admin.html
          sed -i "s/SUBSTITUIR_SENDER_ID/${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}/g" gestao/admin.html
          sed -i "s/SUBSTITUIR_APP_ID/${{ secrets.FIREBASE_APP_ID }}/g" gestao/admin.html
          
          echo "✅ Todos os HTMLs processados!"
      
      # ============================================
      # 🔥 VERIFICAR SE FUNCIONOU
      # ============================================
      - name: Verificar substituição
        run: |
          echo "========================================="
          echo "📁 VERIFICANDO substituição"
          echo "========================================="
          
          # Verificar se os placeholders foram substituídos
          if grep -q "SUBSTITUIR_API_KEY" login.html; then
            echo "❌ ERRO: Placeholders ainda estão no login.html!"
            exit 1
          else
            echo "✅ login.html processado com sucesso!"
          fi
          
          if grep -q "SUBSTITUIR_API_KEY" home-gestao.html; then
            echo "❌ ERRO: Placeholders ainda estão no home-gestao.html!"
            exit 1
          else
            echo "✅ home-gestao.html processado com sucesso!"
          fi
          
          if grep -q "SUBSTITUIR_API_KEY" gestao/admin.html; then
            echo "❌ ERRO: Placeholders ainda estão no admin.html!"
            exit 1
          else
            echo "✅ admin.html processado com sucesso!"
          fi
          
          echo ""
          echo "📄 Trecho do login.html com FIREBASE_CONFIG:"
          grep -A 8 "FIREBASE_CONFIG" login.html | head -10
      
      # ============================================
      # 🔥 UPLOAD
      # ============================================
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          name: github-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages